services:
  test-db:
    image: postgres:16-alpine
    container_name: hmbtr_test_db
    environment:
      POSTGRES_DB: hmbtr_test
      POSTGRES_USER: hmbtr_test
      POSTGRES_PASSWORD: hmbtr_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hmbtr_test -d hmbtr_test']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
